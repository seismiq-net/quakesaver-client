name: Test

on:
  # Restricted to main: an unfiltered `push` made every pull request run the
  # suite twice, doubling the load the tests put on the shared test account.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # The tests run against a live backend, so one flaky version should not
      # hide the results of the others.
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
      - name: Install
        run: make install_dependencies
      - name: Run tests
        env:
          TEST_CLIENT_EMAIL: '${{ secrets.TEST_USER_EMAIL }}'
          TEST_CLIENT_PASSWORD: '${{ secrets.TEST_USER_PASSWORD }}'
          TEST_CLIENT_DOMAIN: '${{ secrets.TEST_CLIENT_DOMAIN }}'
        run: make test
