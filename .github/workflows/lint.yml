name: Lint

on:
  push:

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keyed by ref so that pushing one branch does not cancel another's lint run.
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: make install
      - name: Lint Code
        run: make lint
