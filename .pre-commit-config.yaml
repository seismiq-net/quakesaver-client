# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Run these with `prek run --all-files` (see the `lint` target in the Makefile).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
  - repo: https://github.com/jendrikseipp/vulture
    rev: "v2.16"
    hooks:
      - id: vulture
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.3"
    hooks:
      - id: ruff-check
        args:
          - "--fix"
          - "--exit-non-zero-on-fix"
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell
        args:
          - "--write-changes"
        # The schemas and the models generated from them mirror the backend
        # field names verbatim (e.g. "instituion"), so spelling fixes there
        # would stop the models from matching the API payloads.
        exclude: |
          (?x)^(
            .*\.(jinja2|js)|
            uv\.lock|
            pydantic_schemas/.*|
            quakesaver_client/models/(data_products|sensor_state)\.py
          )$
